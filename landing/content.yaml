hero:
  title: "Агрономическое заключение по фото и описанию поля — за час, без выезда специалиста"
  body: >-
    Отправляете фото и описание проблемы в бот — получаете PDF с обоснованным
    заключением и конкретным решением. Без визита агронома на поле.
  cta_label: "Запросить доступ"
  note: "Полный цикл — около часа. Нужны фото поля и короткое описание проблемы."

steps_title: "Как это работает"
steps:
  - number: "1"
    title: "Доступ"
    body: >-
      Менеджер выдаёт код доступа в бот. Код закрепляется за вашей компанией.
  - number: "2"
    title: "Фото и описание"
    body: >-
      Агроном хозяйства отправляет в бот фотографии и описание проблемы.
  - number: "3"
    title: "Заключение"
    body: >-
      В течение часа приходит PDF-заключение с обоснованием и решением.

report_sample:
  title: "Фрагмент заключения"
  image_webp: "sample-report.webp"
  image_png: "sample-report.png"
  image_alt: "Фрагмент страницы агрономического заключения"
  caption: >-
    Фрагмент настоящего заключения. Данные хозяйства в примере изменены.
  intro: >-
    Заключение строится на детерминированном скоринге по четырнадцати
    критериям, а не на интуиции модели. Каждый вывод сопровождается
    обоснованием. Решение — конкретное: что делать и в какой срок.

limits:
  title: "Что мы не делаем"
  items:
    - "Заключение не заменяет очный осмотр в сложных случаях."
    - "Торговые названия препаратов и нормы расхода в заключении не указываются."
    - "Если данных недостаточно, бот запросит дополнительные фото."

